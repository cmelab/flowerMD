  - nbmake
  - networkx
  - python >=3.11, <3.14
  - fresnel >=0.13.5
  - cmeutils >=1.3
  - pip:
      - build
      - "gmso @ git+https://github.com/mosdef-hub/gmso"
      - "mbuild @ git+https://github.com/mosdef-hub/mbuild@develop"
