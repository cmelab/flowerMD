name: flowermd-dev-test
channels:
  - conda-forge
dependencies:
  - foyer >=1.0
  - freud >=3.4
  - gsd >=3.0,<5
  - grits >=0.6.0
  - hoomd>=5.0,!=5.3.0
  - numpy >=2.0
  - openbabel >=3
  - pip
  - pre-commit
  - py3Dmol
  - pytest
  - pytest-cov
  - rdkit
