name: mupt-demo-flower
channels:
  - conda-forge
  - defaults
dependencies:
  # Basic Python dependencies
  - python>=3.12,<3.14  # <3.14 because of https://github.com/openforcefield/openff-units/pull/178
  - pip
  - jupyterlab

  # Linting and formatting
  - ruff
  - pre-commit

  # Unit testing
  - pytest
  - pytest-cov
  - codecov
  - nbval

  # Mathematics and scientific computing
  - numpy
  - scipy>=1.16.0 # required to allow use of RigidTransform
  - sympy

  # Graphs
  - anytree
  - networkx

  # Visualization
  - rich
  - pygraphviz
  - matplotlib
  - ipympl

  # Chemistry
  - rdkit
  - periodictable

  # Molecular Dynamics toolkits
  ## Visualization
  - py3Dmol
  - openbabel>=3.0

  ## OpenFF
  # - openff-toolkit>=0.18
  # - openff-interchange>=0.5
  # - openff-nagl-models

  ## HOOMD
  - hoomd>=5.3.0,!=5.3.1
  - gsd>=3.0,<5
  - freud>=3.4
  - fresnel

  ## MoSDeF
  - foyer>=1.0

  ## CME Lab
  - grits >=0.6.0
  - cmeutils >=1.3

  - pip:
    - build
    - twine
    - mupt @ git+https://github.com/MuPT-hub/mupt.git@prim-refactor
    - flowermd @ git+https://github.com/cmelab/flowerMD.git@mupt-demo
    - "gmso @ git+https://github.com/mosdef-hub/gmso"
    - "mbuild @ git+https://github.com/mosdef-hub/mbuild@develop"
